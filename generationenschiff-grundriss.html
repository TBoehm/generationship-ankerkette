<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generationenschiff Ankerkette, Generalplan und Deckpläne</title>
<style>
  :root{
    --hull:#0e1216;
    --panel:#161c22;
    --rule:#2b343d;
    --bone:#e6e2d8;
    --dim:#98a1a9;
    --brass:#c9a253;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--hull);color:var(--bone);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  canvas{display:block;touch-action:none}
  #stage{position:fixed;inset:0}

  .plate{
    position:fixed;left:0;right:0;top:0;pointer-events:none;
    padding:10px 14px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:linear-gradient(180deg,rgba(14,18,22,.94),rgba(14,18,22,0));
  }
  .plate h1{font-size:15px;font-weight:600;line-height:1.2}
  .plate h1 span{color:var(--dim);font-weight:400}
  .keydata{
    margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 14px;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:10.5px;color:var(--dim);
  }
  .keydata b{color:var(--brass);font-weight:600}

  #sheet{
    position:fixed;left:0;right:0;bottom:0;max-height:62vh;
    display:flex;flex-direction:column;
    background:rgba(22,28,34,.975);border-top:1px solid var(--rule);backdrop-filter:blur(8px);
  }
  #grip{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 14px;border-bottom:1px solid var(--rule);cursor:pointer;user-select:none;
  }
  #grip .t{font-size:12.5px;font-weight:600;min-width:0}
  #grip .t em{font-style:normal;color:var(--dim);font-weight:400}
  #grip .arrow{color:var(--dim);font-size:12px;transition:transform .18s;flex:0 0 auto}
  #sheet.folded .arrow{transform:rotate(180deg)}
  #sheet.folded #body{display:none}
  #body{overflow-y:auto;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}

  .crumbs{
    display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    padding:9px 14px 0;font-size:11px;color:var(--dim);
  }
  .crumbs button{
    background:none;border:0;color:var(--brass);font:inherit;font-size:11px;
    cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;
  }

  .row{
    display:flex;align-items:flex-start;gap:10px;width:100%;
    padding:9px 14px;background:none;border:0;border-bottom:1px solid rgba(43,52,61,.55);
    color:var(--bone);text-align:left;font:inherit;font-size:12.5px;cursor:pointer;
  }
  .row:hover{background:rgba(255,255,255,.035)}
  .swatch{width:9px;height:9px;border-radius:2px;flex:0 0 auto;margin-top:4px}
  .row .nm{flex:1;line-height:1.35;min-width:0}
  .row .nm small{display:block;color:var(--dim);font-size:11px;margin-top:1px}
  .row .z{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:var(--dim);white-space:nowrap;margin-top:2px}

  #detail{padding:14px}
  #detail h2{font-size:16px;font-weight:600;line-height:1.25}
  #detail .role{color:var(--dim);font-size:12px;margin-top:2px}
  #detail p{font-size:13px;line-height:1.55;margin-top:11px;max-width:64ch}
  dl.spec{
    margin-top:13px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    border-top:1px solid var(--rule);padding-top:11px;
  }
  dl.spec dt{color:var(--dim)}
  dl.spec dd{text-align:right}
  .cta{
    margin-top:15px;display:flex;gap:8px;flex-wrap:wrap;
  }
  .cta button{
    background:none;border:1px solid var(--rule);color:var(--dim);font:inherit;font-size:12px;
    padding:7px 13px;border-radius:3px;cursor:pointer;
  }
  .cta button:hover{border-color:var(--brass);color:var(--brass)}
  .cta button.prime{border-color:var(--brass);color:var(--brass)}

  .planwrap{overflow-x:auto;padding:12px 14px 4px;-webkit-overflow-scrolling:touch}
  .planwrap svg{display:block}
  .planhint{padding:0 14px 8px;font-size:11px;color:var(--dim)}
  .plan-room{cursor:pointer}
  .plan-room rect{stroke:#0e1216;stroke-width:1.1;transition:opacity .12s}
  .plan-room:hover rect{opacity:.78}
  .plan-room text{fill:#0e1216;font-size:8px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;pointer-events:none}
  .plan-corr{fill:#232b33}
  .plan-corr-label{fill:#7d868e;font-size:7px;font-family:ui-monospace,Menlo,monospace}
  .plan-frame{fill:none;stroke:#3c4650;stroke-width:1.4}
  .plan-dim{fill:#7d868e;font-size:7.5px;font-family:ui-monospace,Menlo,monospace}

  #tools{position:fixed;right:12px;top:calc(70px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:7px}
  #tools button{
    background:rgba(22,28,34,.9);border:1px solid var(--rule);color:var(--dim);
    font:inherit;font-size:11px;padding:7px 10px;border-radius:3px;cursor:pointer;backdrop-filter:blur(6px);
  }
  #tools button.on{border-color:var(--brass);color:var(--brass)}
  button:focus-visible,.row:focus-visible,.plan-room:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  @media (min-width:900px){
    #sheet{left:auto;top:0;bottom:0;width:430px;max-height:none;border-top:0;border-left:1px solid var(--rule)}
    #grip{padding-top:calc(14px + env(safe-area-inset-top,0px))}
    #sheet.folded #body{display:block}
    #grip .arrow{display:none}
    .plate{right:430px}
    #tools{right:444px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

<div id="tools">

</div>

</div>

function mat(color, o){
  o = o||{};
  const m = new THREE.MeshStandardMaterial({
    color:color,
    metalness:o.metal!==undefined?o.metal:0.55,
    roughness:o.rough!==undefined?o.rough:0.62,
    transparent:o.opacity!==undefined,
    opacity:o.opacity!==undefined?o.opacity:1,
    side:o.side||THREE.FrontSide,
    emissive:new THREE.Color(0x000000)
  });
  m.userData.base = new THREE.Color(color);
  m.userData.baseOp = m.opacity;
  return m;
}

  m.userData = Object.assign({id:id}, extra||{});

  return m;
}

const CUT_START = -Math.PI*0.30, CUT_LEN = Math.PI*1.5; // 90 Grad offen für die Schnittansicht
function buildRing(id, baseColor, zc){
  const decks = DECKS[id];
  // Außenwand und Innenwand
  add(id, new THREE.CylinderGeometry(125,125,30,72,1,true,CUT_START,CUT_LEN),
      mat(baseColor,{metal:.5,rough:.55,side:THREE.DoubleSide}), 0,0,zc, HZ, 0,0, {deck:0});
  add(id, new THREE.CylinderGeometry(100,100,30,72,1,true,CUT_START,CUT_LEN),
      mat(0x39434d,{metal:.6,rough:.5,side:THREE.DoubleSide}), 0,0,zc, HZ);
  // Stirnwände
  [-15,15].forEach(dz=>{
    const rg = new THREE.RingGeometry(100,125,72,1,CUT_START,CUT_LEN);
    add(id, rg, mat(0x2f3841,{metal:.6,rough:.55,side:THREE.DoubleSide}), 0,0,zc+dz);
  });
  // Deckböden
  decks.forEach((d,di)=>{
    if(di===0) return; // Deck 1 liegt auf der Außenwand
    add(id, new THREE.CylinderGeometry(d.r,d.r,30,72,1,true,CUT_START,CUT_LEN),
        mat(0x505b66,{metal:.5,rough:.6,side:THREE.DoubleSide}), 0,0,zc, HZ, 0,0, {deck:di});
  });
  // Sektorschotte
  for(let s=0;s<4;s++){
    const a = s*Math.PI/2 + CUT_START;
    const w = new THREE.Mesh(new THREE.BoxGeometry(25,1.5,30), mat(0x8b7f66,{metal:.85,rough:.35}));
    w.position.set(Math.cos(a)*112.5, Math.sin(a)*112.5, zc);
    w.rotation.z = a;
    w.userData = {id:id};
    groups[id].add(w); pickable.push(w);
  }
  // Räume als Blöcke auf jedem Deck, drei sichtbare Sektoren
  decks.forEach((d,di)=>{
    const total = d.rooms.reduce((s,r)=>s+r.a,0);
    for(let s=0;s<3;s++){
      let a0 = CUT_START + s*Math.PI/2 + 0.035;
      const span = Math.PI/2 - 0.07;
      d.rooms.forEach((rm,ri)=>{
        const w = span * (rm.a/total);
        const ac = a0 + w/2;
        const rad = d.r - 2.6;
        const chord = 2*rad*Math.sin(Math.max(w/2-0.006,0.004));
        const box = new THREE.Mesh(new THREE.BoxGeometry(chord, 3.6, 23), mat(rm.c,{metal:.4,rough:.7}));
        box.position.set(Math.cos(ac)*rad, Math.sin(ac)*rad, zc);
        box.rotation.z = ac + Math.PI/2;
        box.userData = {id:id, deck:di, room:ri};
        groups[id].add(box); pickable.push(box);
        a0 += w;
      });
    }
  });
  // Speichen
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    const sp = new THREE.Mesh(new THREE.BoxGeometry(4.5,88,7), mat(0x8b7f66,{metal:.85,rough:.35}));
    sp.position.set(Math.cos(a)*57, Math.sin(a)*57, zc);
    sp.rotation.z = a - Math.PI/2;
    sp.userData = {id:id};
    groups[id].add(sp); pickable.push(sp);
  }
  add(id, new THREE.CylinderGeometry(20,20,34,24), mat(baseColor,{metal:.7,rough:.4}), 0,0,zc, HZ);
}

function place(){
  camera.position.set(
    target.x + dist*Math.sin(phi)*Math.cos(theta),
    target.y + dist*Math.cos(phi),
    target.z + dist*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(target);
}

let dragging=false, moved=0, lx=0, ly=0, pinch=0;
const el = renderer.domElement;
el.addEventListener('pointerdown', e=>{ dragging=true; moved=0; lx=e.clientX; ly=e.clientY; el.setPointerCapture(e.pointerId); });
el.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  theta -= dx*0.005;
  phi = Math.max(0.12, Math.min(Math.PI-0.12, phi - dy*0.005));
});
el.addEventListener('pointerup', e=>{ dragging=false; if(moved<7) pick(e.clientX,e.clientY); });
el.addEventListener('pointercancel', ()=>{ dragging=false; });
el.addEventListener('wheel', e=>{ e.preventDefault(); goal.dist = Math.max(180, Math.min(3000, goal.dist*(1+Math.sign(e.deltaY)*0.12))); }, {passive:false});
el.addEventListener('touchmove', e=>{
  if(e.touches.length===2){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(pinch) goal.dist = Math.max(180, Math.min(3000, goal.dist*(pinch/d)));
    pinch=d; dragging=false;
  }
},{passive:true});
el.addEventListener('touchend', ()=>{ pinch=0; });

let sel = {sec:null, deck:null, room:null};
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

function pick(cx,cy){
  ndc.x=(cx/innerWidth)*2-1; ndc.y=-(cy/innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits = ray.intersectObjects(pickable,false).filter(h=>h.object.visible && h.object.material.opacity>0.06);
  if(!hits.length){ setSel(null,null,null); return; }
  const u = hits[0].object.userData;
  setSel(u.id, u.deck!==undefined?u.deck:null, u.room!==undefined?u.room:null);
}

function applyHighlight(){
  pickable.forEach(m=>{
    const u = m.userData, mt = m.material;
    let lit = true;
    if(sel.sec){
      lit = (u.id === sel.sec);
      if(lit && sel.deck!==null && u.deck!==undefined) lit = (u.deck === sel.deck);
    }
    mt.color.copy(mt.userData.base);
    if(!lit) mt.color.lerp(new THREE.Color(0x252c33), 0.76);
    const hot = sel.room!==null && u.id===sel.sec && u.deck===sel.deck && u.room===sel.room;
    mt.emissive.setHex(hot ? 0x3a2a10 : 0x000000);
    if(mt.userData.baseOp < 1) mt.opacity = lit ? mt.userData.baseOp : mt.userData.baseOp*0.35;
  });
}

function setSel(sec, deck, room){
  sel = {sec:sec, deck:deck===undefined?null:deck, room:room===undefined?null:room};
  applyHighlight();
  render();
  if(sec==='ringA') flyTo(150, sel.deck!==null?330:600);
  else if(sec==='ringB') flyTo(270, sel.deck!==null?330:600);
  else if(sec) flyTo(zOf(sec), 900);
  else flyTo(60, 1250);
  sheet.classList.remove('folded');
  grip.setAttribute('aria-expanded','true');
}
function zOf(id){
  const g = groups[id];
  const b = new THREE.Box3().setFromObject(g);
  return (b.min.z+b.max.z)/2;
}

        + '<span class="nm">'+d.name+'<small>'+d.use+', '+d.rooms.length+' Raumtypen</small></span>'
        + '<span class="z">r '+d.r+' m<br>'+gAt(d.r).toFixed(2).replace('.',',')+' g</span></button>';
    });
  }
  body.innerHTML = h;
  wireCrumbs();
  body.querySelectorAll('[data-deck]').forEach(b=> b.onclick=()=> setSel(sel.sec, +b.dataset.deck, null));
}

function viewDeck(s, d, di){
  gripTitle.innerHTML = d.name+' <em>Deckplan</em>';
  const L = 2*Math.PI*d.r/4;           // Sektorlänge in m
  const sectorArea = L*30;
  const SC = 5;                         // Pixel pro Meter
  const roomTotal = d.rooms.reduce((a,r)=>a+r.a,0);

  // Aufteilung: zwei Raumreihen à 13 m, dazwischen ein Längsgang von 4 m
  const rowH = 13;
  let xTop=0, xBot=0;
  const placed = [];
  d.rooms.forEach((rm,ri)=>{
    const w = rm.a/rowH;
    const top = xTop <= xBot;
    placed.push({rm:rm, ri:ri, x:top?xTop:xBot, y:top?0:17, w:w});
    if(top) xTop += w; else xBot += w;
  });

  const W = Math.max(xTop,xBot,L), H = 30;
  let svg = '<svg width="'+(W*SC)+'" height="'+(H*SC+18)+'" viewBox="0 0 '+W+' '+(H+3.6)+'" xmlns="http://www.w3.org/2000/svg">';
  svg += '<rect class="plan-corr" x="0" y="13" width="'+W+'" height="4"/>';
  svg += '<text class="plan-corr-label" x="3" y="15.9">Längsgang, 4 m breit, durchgehend über den ganzen Ring</text>';
  placed.forEach(p=>{
    svg += '<g class="plan-room" data-room="'+p.ri+'" tabindex="0">'
        + '<rect x="'+p.x.toFixed(2)+'" y="'+p.y+'" width="'+p.w.toFixed(2)+'" height="'+rowH+'" fill="'+hex(p.rm.c)+'"/>';
    if(p.w*SC > 58){
      const words = p.rm.n.split(' ');
      let l1=words.shift(), l2=words.join(' ');
      while(l2.length>0 && l1.length<13 && words.length===0) break;
      svg += '<text x="'+(p.x+1.4).toFixed(2)+'" y="'+(p.y+4.6)+'">'+l1+'</text>';
      if(l2) svg += '<text x="'+(p.x+1.4).toFixed(2)+'" y="'+(p.y+8.2)+'">'+l2+'</text>';
      svg += '<text x="'+(p.x+1.4).toFixed(2)+'" y="'+(p.y+11.6)+'" opacity=".72">'+fmt(p.rm.a)+' m²</text>';
    }
    svg += '</g>';
  });
  svg += '<rect class="plan-frame" x="0" y="0" width="'+W.toFixed(2)+'" height="'+H+'"/>';
  svg += '<text class="plan-dim" x="0" y="'+(H+3)+'">◀ '+L.toFixed(0)+' m Sektorlänge ▶   |   30 m Deckbreite   |   '+fmt(Math.round(sectorArea))+' m² je Sektor</text>';
  svg += '</svg>';

  let h = crumbs([{t:'Verzeichnis',go:'root'},{t:s.name,go:'sec'},{t:d.name.split(',')[0]}]);
  h += '<div id="detail"><h2>'+d.name+'</h2><div class="role">'+d.use+', Radius '+d.r+' m, '+gAt(d.r).toFixed(2).replace('.',',')+' g</div>'
     + '<p>'+d.note+'</p></div>';
  h += '<div class="planwrap">'+svg+'</div>';
  h += '<div class="planhint">Ausgerollter Plan eines von vier baugleichen Sektoren. Tippe einen Raum an, seitlich scrollen für die volle Länge.</div>';
  d.rooms.forEach((rm,ri)=>{
    h += '<button class="row" data-room="'+ri+'">'
      + '<span class="swatch" style="background:'+hex(rm.c)+'"></span>'
      + '<span class="nm">'+rm.n+(rm.d?'<small>'+rm.d+'</small>':'')+'</span>'
      + '<span class="z">'+fmt(rm.a)+' m²</span></button>';
  });
  body.innerHTML = h;
  wireCrumbs();
  body.querySelectorAll('[data-room]').forEach(b=>{
    const go = ()=> setSel(sel.sec, di, +b.dataset.room);
    b.onclick = go;
    b.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  });
}

function viewRoom(s, d, di, rm, ri){
  gripTitle.innerHTML = rm.n+' <em>Raumdaten</em>';
  const perSector = rm.a, all = rm.a*4;
  const share = (rm.a/(2*Math.PI*d.r/4*30)*100).toFixed(1).replace('.',',');
  let h = crumbs([{t:'Verzeichnis',go:'root'},{t:s.name,go:'sec'},{t:d.name.split(',')[0],go:'deck'},{t:rm.n}]);
  h += '<div id="detail"><h2>'+rm.n+'</h2><div class="role">'+d.name+', '+s.name.split(',')[0]+'</div>';
  if(rm.d) h += '<p>'+rm.d+'</p>';
  h += '<dl class="spec">'
     + '<dt>Fläche je Sektor</dt><dd>'+fmt(perSector)+' m²</dd>'
     + '<dt>Fläche im Ring</dt><dd>'+fmt(all)+' m²</dd>'
     + '<dt>Anteil am Deck</dt><dd>'+share+' %</dd>'
     + '<dt>Deckhöhe</dt><dd>5 m</dd>'
     + '<dt>Schwerkraft</dt><dd>'+gAt(d.r).toFixed(2).replace('.',',')+' g</dd>'
     + '<dt>Vorkommen</dt><dd>4 x, je Sektor</dd>'
     + '</dl>'
     + '<div class="cta"><button data-crumb="deck" class="prime">Zurück zum Deckplan</button></div></div>';
  body.innerHTML = h;
  wireCrumbs();
}

function render(){
  const s = SECTIONS.find(x=>x.id===sel.sec);
  if(!s){ viewIndex(); return; }
  if(sel.deck===null || !s.ring){ viewSection(s); return; }
  const d = DECKS[s.id][sel.deck];
  if(sel.room===null){ viewDeck(s,d,sel.deck); return; }
  viewRoom(s,d,sel.deck,d.rooms[sel.room],sel.room);
}

grip.onclick = ()=>{ const f=sheet.classList.toggle('folded'); grip.setAttribute('aria-expanded',String(!f)); };
grip.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); grip.click(); } };

const btnCut = document.getElementById('btnCut');
let cut=false;
btnCut.onclick = ()=>{
  cut=!cut;
  groups.mantel.visible=!cut; groups.tanks.visible=!cut;
  btnCut.textContent = cut?'Mantel an':'Mantel aus';
  btnCut.classList.toggle('on',cut);
  btnCut.setAttribute('aria-pressed',String(cut));
};
const btnSpin = document.getElementById('btnSpin');
let spin=true; btnSpin.classList.add('on');
btnSpin.onclick = ()=>{
  spin=!spin;
  btnSpin.textContent = spin?'Rotation an':'Rotation aus';
  btnSpin.classList.toggle('on',spin);
  btnSpin.setAttribute('aria-pressed',String(spin));
};
document.getElementById('btnReset').onclick = ()=>{ theta=0.85; phi=1.15; setSel(null,null,null); };

render(); applyHighlight();

/* ================================================================
   7. LAUF
   ================================================================ */
const slow = matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){
  requestAnimationFrame(loop);
  if(spin && !slow && sel.deck===null){
    groups.ringA.rotation.z += 0.0022;
    groups.ringB.rotation.z -= 0.0022;
  }
  target.z += (goal.tz - target.z)*0.08;
  dist += (goal.dist - dist)*0.08;
  place();
  renderer.render(scene,camera);
}
loop();
</script>
